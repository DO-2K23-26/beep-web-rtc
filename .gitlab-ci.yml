stages:
  - security
  - sbom            # nouvelle étape pour SBOM
  - build
  - tag
  - deploy

variables:
  IMAGE_NAME: ${HARBOR_HOST}/${HARBOR_PROJECT}/${CI_PROJECT_NAME}

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      variables:
        VERSION: ${CI_COMMIT_SHORT_SHA}-development
        ENVIRONMENT: development
    - if: $CI_COMMIT_REF_NAME  == $CI_DEFAULT_BRANCH
      variables:
        VERSION: ${CI_COMMIT_SHORT_SHA}-staging
        ENVIRONMENT: staging
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/'
      variables:
        VERSION: $CI_COMMIT_TAG
        ENVIRONMENT: production
    - when: always

########################################
# 1) Job Syft SBOM (Hex/Erlang/Elixir) #
########################################
syft-sbom:
  stage: sbom
  image:
    name: docker:24.0.5
    entrypoint: ['']
  variables:
    # Emplacement du fichier SBOM Syft
    SYFT_SBOM_FILE: syft_cyclonedx.json
  services:
    - name: docker:24.0.5-dind
      alias: docker
  before_script:
    # On installe curl (pour télécharger syft) et docker
    - apk add --no-cache curl
    # Téléchargement et installation de Syft (v1.3.0)
    - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v1.3.0
    # Récupération des dépendances Elixir/Erlang
    - mix local.hex --force
    - mix deps.get
  script:
    # Lancer Syft en catalogant spécifiquement Elixir & Erlang
    #
    # - –select-catalogers elixir,erlang : pour analyser les dépendances Hex.
    # - -o cyclonedx-json=${SYFT_SBOM_FILE} : sortie au format CycloneDX JSON.
    - syft scan dir:./ --select-catalogers elixir,erlang -o cyclonedx-json=${SYFT_SBOM_FILE}
    # Vérification rapide
    - ls -lh ${SYFT_SBOM_FILE}
  artifacts:
    paths:
      - ${SYFT_SBOM_FILE}
    expire_in: 1 week
  rules:
    # Exécuter sur branche principale, tag version, ou MR
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

##################################
# 2) Job Upload vers Vigiles     #
##################################
vigiles-upload:
  stage: sbom
  needs: [syft-sbom]
  image:
    name: docker:24.0.5
    entrypoint: ['']
  variables:
    # Chemin vers le SBOM généré
    SYFT_SBOM_FILE: syft_cyclonedx.json
    # Votre clé d’API Vigiles (à définir dans vos variables CI/CD GitLab)
    VIGILES_API_KEY: ${VIGILES_API_KEY}
  before_script:
    - apk add --no-cache curl jq
    # Installation du binaire vigiles-cli
    - curl -sSfL https://raw.githubusercontent.com/timesys/vigiles/main/install.sh | sh -s -- -b /usr/local/bin
  script:
    # Vérifier que le SBOM est bien présent
    - '[ -f ${SYFT_SBOM_FILE} ] || (echo "SBOM Syft manquant" && exit 1)'
    # Upload du SBOM vers Vigiles via la CLI
    - vigiles -k ${VIGILES_API_KEY} manifest upload ${SYFT_SBOM_FILE} \
        --output json > vigiles-upload-result.json
    # Facultatif : afficher l’URL de la WebUI retournée
    - cat vigiles-upload-result.json | jq -r '.url' | tee vigiles_url.txt
  artifacts:
    paths:
      - vigiles-upload-result.json
      - vigiles_url.txt
    expire_in: 1 week
  rules:
    # Ne lancer ce job QUE s’il y a eu succès du job syft-sbom
    - if: $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      when: manual   # par exemple, on peut rendre l’upload manuel sur la branche principale
    - if: $CI_COMMIT_TAG
      when: manual   # idem pour les tags de release
    - when: never

########################################
# 3) Job Trivy SBOM & Scanner         #
########################################
trivy-sbom-scan:
  stage: security
  image:
    name: docker:24.0.5
    entrypoint: ['']
  services:
    - name: docker:24.0.5-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: ''
    # Nom du fichier SBOM Trivy (CycloneDX)
    TRIVY_SBOM_FILE: trivy_cyclonedx.json
  before_script:
    - apk add --no-cache curl
    # Installer Trivy (version stable)
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
    # Authentification Docker pour pouvoir scanner l’image si besoin
    - mkdir -p ~/.docker
    - echo "{\"auths\":{\"${HARBOR_HOST}\":{\"auth\":\"$(echo -n ${HARBOR_USERNAME}:${HARBOR_PASSWORD} | base64 -w 0)\"}}}" \
        > ~/.docker/config.json
    - docker login -u ${HARBOR_USERNAME} -p ${HARBOR_PASSWORD} ${HARBOR_HOST} || true
  script:
    # 3.1 Générer un SBOM CycloneDX pour le système de fichiers (projet complet)
    - trivy fs --format cyclonedx --output ${TRIVY_SBOM_FILE} .
    # 3.2 Scanner ce SBOM pour détecter les vulnérabilités
    - trivy sbom ${TRIVY_SBOM_FILE} || true
    # 3.3 (Optionnel) Générer aussi un SBOM SPDX, si besoin
    # - trivy fs --format spdx-json --output trivy_spdx.json .
    # - trivy sbom trivy_spdx.json || true
    # 3.4 (Optionnel) Scanner l’image Docker directement au cas où
    - if [ -n "$CI_COMMIT_TAG" ] || [ "$CI_COMMIT_REF_NAME" == "$CI_DEFAULT_BRANCH" ]; then
        trivy image --format cyclonedx --output trivy_image_sbom.json ${IMAGE_NAME}:${VERSION} || true;
        trivy sbom trivy_image_sbom.json || true;
      fi
  artifacts:
    paths:
      - ${TRIVY_SBOM_FILE}
      - trivy_image_sbom.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

##################################
# Jobs existants (préservés)     #
##################################

horusec-security:
  stage: security
  image: horuszup/horusec-cli:latest
  variables:
    GIT_DEPTH: 0 # Required when commit authors is enabled
  script:
    - horusec start -p . --disable-docker
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

trivy-security:
  stage: security
  image:
    name: docker:24.0.5
    entrypoint: ['']
  services:
    - name: docker:24.0.5-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: ''
  before_script:
    - apk add --no-cache curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
    - mkdir -p ~/.docker
    - echo "{\"auths\":{\"${HARBOR_HOST}\":{\"auth\":\"$(echo -n ${HARBOR_USERNAME}:${HARBOR_PASSWORD} | base64 -w 0)\"}}}" > ~/.docker/config.json
    - docker login -u ${HARBOR_USERNAME} -p ${HARBOR_PASSWORD} ${HARBOR_HOST}
    - docker pull $IMAGE_NAME:${VERSION} || true
  script:
    # Scan complet du système de fichiers avec options avancées
    - trivy fs --config trivy.yaml .
    
    # Scan spécifique du Dockerfile avec analyse approfondie
    - trivy config --config trivy.yaml Dockerfile
    
    # Scan des dépendances avec analyse approfondie
    - trivy fs --config trivy.yaml mix.lock
    
    # Scan de l'image Docker avec analyse approfondie
    - trivy image --config trivy.yaml $IMAGE_NAME:${VERSION} || true
    
    # Scan des configurations Kubernetes/Helm avec analyse approfondie
    - trivy config --config trivy.yaml helm/
    
    # Scan des fichiers de configuration spécifiques
    - trivy config --config trivy.yaml .gitlab-ci.yml
    - trivy config --config trivy.yaml config/
    
    # Scan des secrets et des fichiers sensibles
    - trivy fs --config trivy.yaml .
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.14.0-debug
    entrypoint: ['']
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${HARBOR_HOST}\":{\"auth\":\"$(echo -n ${HARBOR_USERNAME}:${HARBOR_PASSWORD} | base64 -w 0)\"}}}" > /kaniko/.docker/config.json
    - >-
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile $CI_PROJECT_DIR/Dockerfile
      --destination "$IMAGE_NAME:${VERSION}"
      --snapshot-mode=redo
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: manual

tag:
  stage: tag
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: ''
    STAGING_IMAGE: $IMAGE_NAME:${CI_COMMIT_SHORT_SHA}-staging
  script:
    - docker info
    - echo $HARBOR_PASSWORD | docker login -u $HARBOR_USERNAME --password-stdin $HARBOR_HOST
    - docker pull $STAGING_IMAGE
    - docker tag $STAGING_IMAGE $IMAGE_NAME:$VERSION
    - docker push $IMAGE_NAME:$VERSION
  rules:
    - if: $CI_COMMIT_TAG

deploy:
  image: alpine/git
  stage: deploy
  variables:
    CURRENT_REPO: beep-webrtc
    SSH_PRIVATE_KEY: ./ssh_key
    KNOWN_HOSTS: ./known_hosts
    VALUES: ./charts/${CURRENT_REPO}/${ENVIRONMENT}.yaml
    REPO: argeepcd
  tags:
    - beep-runner
  before_script:
    - cat $BEEP_BOT_SSH_PRIVATE_KEY |base64 -d > $SSH_PRIVATE_KEY
    - chmod 600 $SSH_PRIVATE_KEY
    - ssh-keyscan gitlab.polytech.umontpellier.fr > $KNOWN_HOSTS
    - GIT_SSH_COMMAND="ssh -i $SSH_PRIVATE_KEY -o UserKnownHostsFile=$KNOWN_HOSTS" git clone "git@gitlab.polytech.umontpellier.fr:beep/${REPO}.git"
    - git config --global user.email "beep@bot.com"
    - git config --global user.name "beep-bot"
    - wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O yq && chmod +x ./yq
  script:
    - cd $REPO
    - ../yq -i ".image.tag = \"$VERSION\"" $VALUES
    - git add .
    - git commit -m "[BUMP] ${CURRENT_REPO}-${ENVIRONMENT} to $VERSION"
    - GIT_SSH_COMMAND="ssh -i .$SSH_PRIVATE_KEY -o UserKnownHostsFile=.$KNOWN_HOSTS" git push "git@gitlab.polytech.umontpellier.fr:beep/${REPO}.git"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
